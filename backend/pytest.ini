[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need Redis/Supabase)
    slow: Slow tests (LLM calls, network)
