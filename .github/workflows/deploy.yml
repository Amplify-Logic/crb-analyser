name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # Run tests on all pushes and PRs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce artifact denylist
        run: python backend/src/scripts/check_tracked_artifacts.py

      # Backend Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov mypy ruff

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=35
        env:
          APP_ENV: test

      - name: Run critical backend smoke suite
        run: |
          cd backend
          pytest tests/routes/test_auth.py tests/routes/test_payments.py tests/test_workshop_routes.py -q

      - name: Check migration drift (Supabase source-of-truth)
        run: |
          cd backend
          python -m src.scripts.check_migration_drift

      - name: Run backend lint (Ruff)
        run: |
          cd backend
          python -m ruff check src/routes/payments.py src/middleware/auth.py src/config/settings.py

      - name: Run mypy type check
        run: |
          cd backend
          python -m mypy src/routes/payments.py src/routes/quiz.py src/middleware/auth.py src/config/settings.py --ignore-missing-imports --follow-imports=skip

      # Frontend Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: |
          cd frontend
          pnpm run lint

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm run test:coverage

      - name: Run frontend type check
        run: |
          cd frontend
          pnpm exec tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build
        env:
          VITE_API_BASE_URL: http://localhost:8383

  # Deploy to staging on staging branch
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Staging
        run: |
          cd backend
          railway link ${{ secrets.RAILWAY_STAGING_PROJECT_ID }} --environment staging
          railway up --service crb-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend to Staging
        run: |
          cd frontend
          railway link ${{ secrets.RAILWAY_STAGING_PROJECT_ID }} --environment staging
          railway up --service crb-frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post-deploy smoke checks (staging)
        if: success() && secrets.STAGING_BACKEND_URL != ''
        run: |
          curl -fsS "${{ secrets.STAGING_BACKEND_URL }}/health"
          curl -fsS "${{ secrets.STAGING_BACKEND_URL }}/api/health/ready"

      - name: Notify deployment
        if: success()
        run: echo "Deployed to staging successfully"

  # Deploy to production on main branch
  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Production
        run: |
          cd backend
          railway link ${{ secrets.RAILWAY_PROD_PROJECT_ID }} --environment production
          railway up --service crb-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend to Production
        run: |
          cd frontend
          railway link ${{ secrets.RAILWAY_PROD_PROJECT_ID }} --environment production
          railway up --service crb-frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post-deploy smoke checks (production)
        if: success() && secrets.PRODUCTION_BACKEND_URL != ''
        run: |
          curl -fsS "${{ secrets.PRODUCTION_BACKEND_URL }}/health"
          curl -fsS "${{ secrets.PRODUCTION_BACKEND_URL }}/api/health/ready"

      - name: Notify Slack on Success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":rocket: CRB Analyser deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *CRB Analyser deployed to production*\n\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify deployment
        if: success()
        run: echo "Deployed to production successfully"
