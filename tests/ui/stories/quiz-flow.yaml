stories:
  - name: "Quiz - Company Research Flow"
    url: "http://localhost:5174/quiz"
    priority: critical
    workflow: |
      Navigate to http://localhost:5174/quiz
      Verify the quiz page loads with a company name input field visible

      Type "ACME Corp" into the company name input field
      Look for and click a submit/research button (e.g., "Find my company", "Research", or similar)

      Wait for research progress indicators to appear (web scan, LinkedIn, Crunchbase steps)
      Verify at least one research progress step is shown
      Wait for research to complete (look for findings or results to appear)

      Verify company research findings are displayed with confidence indicators
      Verify the user can proceed to the next phase of the quiz

  - name: "Quiz - Empty Company Name Validation"
    url: "http://localhost:5174/quiz"
    priority: high
    workflow: |
      Navigate to http://localhost:5174/quiz
      Verify the quiz page loads

      Without entering a company name, try to click the submit/research button
      Verify that either the button is disabled or an error message appears
      Verify the form does not advance to the research phase

  - name: "Quiz - Full Journey to Preview"
    url: "http://localhost:5174/quiz"
    priority: critical
    workflow: |
      Navigate to http://localhost:5174/quiz
      Verify the quiz page loads

      Enter a company name like "Test Company" and submit it
      Wait for company research to complete
      Proceed through the findings review

      Continue through all subsequent quiz phases by interacting with available options
      Look for a teaser/preview section or pricing section to appear
      Verify the quiz progresses through multiple phases (check for progress indicators)

      After completing available steps, verify either:
      - A preview report page is shown, or
      - A pricing/checkout option is presented, or
      - An email capture form appears
