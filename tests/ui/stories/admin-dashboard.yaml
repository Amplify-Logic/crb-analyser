stories:
  - name: "Admin Dashboard - Stats and Navigation"
    url: "http://localhost:5174/admin"
    priority: high
    requires:
      auth: "admin user session (logged in as admin)"
    workflow: |
      Navigate to http://localhost:5174/admin
      Verify the admin dashboard loads

      Look for stat cards (insights count, vendors count, or similar metrics)
      Verify at least one stat card is displayed with a numeric value

      Look for quick-action links to admin sub-pages (vendors, knowledge, insights)
      Verify navigation links are present and clickable

  - name: "Admin Dashboard - Vendor Management"
    url: "http://localhost:5174/admin/vendors"
    priority: high
    requires:
      auth: "admin user session"
    workflow: |
      Navigate to http://localhost:5174/admin/vendors
      Verify the vendor admin page loads

      Look for a vendor list or vendor cards
      Verify at least one vendor is displayed (or an empty state message)

      Look for search or filter controls
      If a search box is present, type a search query
      Verify the vendor list filters based on the search

  - name: "Admin Dashboard - Knowledge Base"
    url: "http://localhost:5174/admin/knowledge"
    priority: medium
    requires:
      auth: "admin user session"
    workflow: |
      Navigate to http://localhost:5174/admin/knowledge
      Verify the knowledge base admin loads

      Look for a sidebar with content type categories
      Verify categories are listed (vendor, opportunity, benchmark, etc.)

      Look for a search control
      Verify the knowledge item list is displayed

      Click on a content type category in the sidebar
      Verify the list filters to show items of that type
